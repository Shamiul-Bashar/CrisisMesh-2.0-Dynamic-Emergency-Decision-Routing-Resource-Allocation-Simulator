name: Deployment Branch CI

on:
  push:
    branches:
      - deploy/fullstack
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend behavior tests
        run: npm run test:frontend

      - name: Frontend build
        run: npm run build

      - name: Check deployment server syntax
        run: node --check server/index.mjs

      - name: Configure C++ backend
        run: cmake -S backend -B backend/build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ backend
        run: cmake --build backend/build -j2

      - name: Run C++ tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Bridge integration tests
        run: npm run test:bridge

      - name: Build deployment container
        run: docker build -t crisismesh-deployment-check .
