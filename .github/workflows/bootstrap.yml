name: Bootstrap source tree

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk{01,02,03,04,05,06,07,08}.b64 | base64 -d > /tmp/crisismesh.tar.gz
          echo "835adb29c3561257e933b432d6db9ff0bbad7129af3537396b95bb2ce16444f6  /tmp/crisismesh.tar.gz" | sha256sum -c -

      - name: Extract source tree
        shell: bash
        run: |
          tar -xzf /tmp/crisismesh.tar.gz -C .
          rm -rf .bootstrap
          rm -f /tmp/crisismesh.tar.gz

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "CrisisMesh Team"
          git config user.email "team@crisismesh.local"
          git add -A
          git rm -f .github/workflows/bootstrap.yml || true
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "chore: import CrisisMesh 2.0 project"
          git push
